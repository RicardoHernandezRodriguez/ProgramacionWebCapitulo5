<!DOCTYPE html>

<!--Fig 5.14: fusionarimagenes.html-->
<!---Fusionar una imagen en otra mediante CSS3.-->
<html>
    <head>
        <meta charset="utf-8">
        <title>Fusi&oacute;n de im&aacute;genes</title>

        <style type="text/css">
            #portada
            {
                position: relative;
                margin: 0 auto;
            }
            #portada img
            {
                position: absolute;
                left: 0;
                -webkit-transition: opacity 4s ease-in-out;
                transition: opacity 4s ease-in-out;
            }
            #portada img.top:hover
                { opacity:0; }
        </style>

    </head>

    <body>
        <p><a href="../ejemplos5.html">Indice ejemplos</a> <a href="ejemplo5.13.html">Anterior ejemplo</a> <a href="ejemplo5.15.html">Siguiente ejemplo</a></p>
        <hr>
        <div id="portada">
            <img class="bottom" src="../../imagenes/jhtp9.png" alt="Portada de Java 9e">
            <img class="top" src="../../imagenes/jhtp8.png" alt="Portada de Java 8e">
        </div>
    </body>
</html>
