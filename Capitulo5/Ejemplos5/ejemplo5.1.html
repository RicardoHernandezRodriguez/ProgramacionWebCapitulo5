<!DOCTYPE html>

<!--Fig 5.1: sombratexto.html-->
<!---Sombra de texto en CSS3.-->
<html>
    <head>
        <meta charset="utf-8">
        <title>Sombra de texto</title>

        <style type="text/css">
            h1
            {
                text-shadow: -4px 4px 6px dimgrey; /* agrega sombra */
                font-size: 400%; /* aumenta el tama&ntilde;o de la fuente */
            }
        </style>

    </head>

    <body>
        <p><a href="../ejemplos5.html">Indice ejemplos</a> Anterior ejemplo <a href="ejemplo5.2.html">Siguiente ejemplo</a></p>
        <hr>
        <h1>Sombra de texto</h1>
    </body>
</html>
