        <h1>Ejercicio 2.16</h1>

        <h2>Cuentanos sobre tu estancia en el campus</h2>
        <form method="post" action="http:www.deitel.com">

            <input type="hidden" name="destinatario" value="deitel@deitel.com">
            <input type="hidden" name="asunto" value="Formulario de visita al campus">
            <input type="hidden" name="redirigir" value="principal.html">

            <p><label>Nombre: <input name="nombre" type="text" size="25"></label></p>
            <p><label>Correo electronico: <input name="correo electronico" type="text" size="25"></label></p>

            <p>
                <strong>Cosas que le gustaron</strong><br>

                <label><input name="cosasgustaron" type="checkbox" value="campus">Campus</label>
                <label><input name="cosasgustaron" type="checkbox" value="estudiantes">Estudiantes</label>
                <label><input name="cosasgustaron" type="checkbox" value="ubicacion">Ubicaci&oacute;n</label>
                <label><input name="cosasgustaron" type="checkbox" value="ambiente">Ambiente</label>
                <label><input name="cosasgustaron" type="checkbox" value="dormitorio">Dormitorios</label>
                <label><input name="cosasgustaron" type="checkbox" value="deportes">Deportes</label>
            </p>

            <p>
                <strong>Como conoci&oacute; nuestra Universidad:</strong>

                <label><input name="comoconocio" type="radio" value="amigos" checked>Amigos</label>
                <label><input name="comoconocio" type="radio" value="television" checked>Televisi&oacute;n</label>
                <label><input name="comoconocio" type="radio" value="internet" checked>Internet</label>
                <label><input name="comoconocio" type="radio" value="otro" checked>Otro</label>
            </p>

            <p><label>Comentarios: <br>
                <textarea name="comentarios" rows="4" cols="36">A&ntilde;ada un comentario</textarea>
            </label></p>

            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Borrar">
            </p>
        </form>
    </body>
</html>
