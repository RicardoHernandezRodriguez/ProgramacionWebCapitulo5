<!DOCTYPE html>

<!-- Fig 2.12: tabla1.html-->
<!-- Creación de una tabla basica-->
 <html>
    <head>
        <meta charset="utf-8">
        <title>Una tabla de HTML5 simple</title>
    </head>

    <body>
        <p><a href="../ejemplos.html">Indice ejemplos</a> <a href="ejemplo2.11.html">Anterior ejemplo</a> <a href="ejemplo2.13.html">Siguiente ejemplo</a></p>
        <hr>
        <!--la etiqueta <table> abre una tabla-->
        <table border="1">

            <!-- la etiqueta <caption> sintetiza el contenido de -->
            <!-- la tabla (esto ayuda a las personas con discapacidad visual) -->    
            <caption><strong>Tabla de frutas (1ra columna) y sus precios (2da columna)</strong></caption>

            <!-- la sección <thead> aparece primero en la tabla -->
            <!-- da formato al área del encabezado de la tabla -->

            <thead>
                <tr>
                    <!-- <tr> inserta una fila en la tabla -->
                    <th>Fruta</th> <!-- Inserta una celda de encabezado -->
                    <th>Precio</th>
                </tr>
            </thead>

            <!-- la sección <tfoot> aparece al ultimo en la tabla -->
            <!--da formato al pie de la tabla -->

            <tfoot>
                <tr>
                    <th>Total</th>
                    <th>$3.75</th>
                </tr>
            </tfoot>

            <!-- todo el contenido de la tabla esta encerrado -->
            <!-- dentro del elemento <tbody> -->
            
            <tbody>
                <tr>
                    <td>Manzana</td> <!--Inserta una celda de datos-->
                    <td>$0.23</td>
                </tr>
                <tr>
                    <td>Naranja</td>
                    <td>$0.50</td>
                </tr>
                <tr>
                    <td>Pl&aacute;tanos</td>
                    <td>$1.00</td>
                </tr>
                <tr>
                    <td>Pi&ntilde;a</td>
                    <td>$2.00</td>
                </tr>
            </tbody>
        </table>
    </body>
 </html>
